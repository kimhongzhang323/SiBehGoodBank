server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: ai-agent-service
  
  # Jackson configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  
  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  
  # WebFlux configuration for reactive streams
  webflux:
    base-path: /
  
  # Kafka configuration (for event publishing)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          chatEvent:com.sibehgoodbank.aiagent.event.ChatEvent
    consumer:
      group-id: ai-agent-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sibehgoodbank.*

# Anthropic API Configuration
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    url: https://api.anthropic.com/v1
    model: ${ANTHROPIC_MODEL:claude-3-sonnet-20240229}
    max-tokens-default: 4096
    temperature-default: 0.7
  rate-limit:
    requests-per-minute: ${ANTHROPIC_RATE_LIMIT_RPM:60}
    tokens-per-minute: ${ANTHROPIC_RATE_LIMIT_TPM:100000}

# Service Discovery
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      anthropicApi:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      
      bankingTools:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  
  retry:
    instances:
      anthropicApi:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
      
      bankingTools:
        max-attempts: 2
        wait-duration: 500ms
  
  ratelimiter:
    instances:
      anthropicApi:
        limit-for-period: 60
        limit-refresh-period: 1m
        timeout-duration: 5s
  
  timelimiter:
    instances:
      anthropicApi:
        timeout-duration: 60s
        cancel-running-future: true
      
      bankingTools:
        timeout-duration: 30s

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    com.sibehgoodbank: DEBUG
    org.springframework.web.reactive: INFO
    io.netty: WARN
    reactor.netty: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# AI Agent specific configuration
ai-agent:
  # Conversation settings
  conversation:
    max-history-size: 50
    history-ttl-hours: 24
    enable-summarization: true
  
  # Tool execution settings
  tools:
    enabled: true
    max-concurrent-calls: 5
    timeout-seconds: 30
  
  # Rate limiting per user
  user-rate-limit:
    requests-per-minute: 20
    tokens-per-day: 50000
  
  # Content moderation
  moderation:
    enabled: true
    block-sensitive-data: true
    audit-logging: true
  
  # System prompts
  prompts:
    banking-assistant: classpath:prompts/banking-assistant.txt
    fraud-detection: classpath:prompts/fraud-detection.txt
    spending-analysis: classpath:prompts/spending-analysis.txt

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

anthropic:
  api:
    model: claude-3-haiku-20240307  # Use cheaper model for dev

eureka:
  client:
    enabled: false

logging:
  level:
    com.sibehgoodbank: TRACE
    org.springframework.web.reactive.function.client: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8084

anthropic:
  api:
    model: claude-3-sonnet-20240229
  rate-limit:
    requests-per-minute: 100
    tokens-per-minute: 200000

logging:
  level:
    root: WARN
    com.sibehgoodbank: INFO
